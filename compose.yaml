services:
  musicdl-web:
    image: ${MUSICDL_WEB_IMAGE:-musicdl-web:0.2.2}
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "4534:4534"
    volumes:
      - ${MUSICDL_WEB_DATA_DIR:-/data/docker/musicdl-web/data}:/app/data
      - ${MUSICDL_WEB_TMP_DIR:-/data/docker/musicdl-web/tmp}:/app/tmp
      - ${MUSICDL_WEB_SESSION_KEY:-/data/docker/musicdl-web/secrets/session.key}:/run/secrets/session.key:ro
      - ${MUSICDL_WEB_MUSIC_DIR:-/data/media/music}:/music
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
